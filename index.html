<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>베베테이블</title>
<style>
  :root { --bg: #FFF8F5; --card: #FFFFFF; --text: #4B3F3A; --muted: #7A6A63; --accent: #E6724A; --line: #FFDBCE; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1F1A18; --card: #2A2421; --text: #F2E9E5; --muted: #C9B8B0; --accent: #FF9C7A; --line: #4A3A33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  h1 { margin: 0 0 8px; font-size: 28px; color: var(--accent); }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); font-size: 15px; }
  a { color: var(--accent); }
  ul { padding-left: 20px; margin: 0 0 16px; }
  footer { margin-top: 24px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>베베테이블</h1>
    <p>집에 있는 재료로 만들 수 있는 이유식 레시피를 찾고, 아기의 식사 · 수유 · 알레르기 확인을 기록하는 안드로이드 앱입니다.</p>
    <ul>
      <li><a href="privacy.html">개인정보 처리방침</a></li>
    </ul>
    <p class="muted">문의: <a href="mailto:a55770019@gmail.com">a55770019@gmail.com</a></p>
  </div>
  <footer>© 2026 베베테이블</footer>
</main>
</body>
</html>
